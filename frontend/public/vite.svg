<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Back card -->
  <rect x="6" y="4" width="20" height="24" rx="2" fill="#94A3B8" transform="rotate(6 16 16)"/>
  <!-- Front card -->
  <rect x="6" y="4" width="20" height="24" rx="2" fill="url(#cardGrad)"/>
  <!-- Letter A -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">A</text>
</svg>